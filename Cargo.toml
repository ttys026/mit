[package]
name = "mit"
version = "1.1.0"
edition = "2021"

[dependencies]
anyhow = "1.0"
base64 = "0.22"
clap = { version = "4.5", features = ["derive"] }
indexmap = "=2.11.4"
aes = "0.8"
cbc = "0.1"
rsa = "0.9"
rand = "0.8"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "gzip", "deflate", "rustls-tls", "cookies"] }
rumqttc = { version = "0.24", default-features = false, features = ["use-rustls"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha1 = "0.10"
sha2 = "0.10"
md5 = "0.7"
crossterm = "0.29"
ratatui = { version = "0.30", default-features = false, features = ["std"] }
ratatui-crossterm = { version = "0.1", default-features = false, features = ["crossterm_0_29"] }
ratatui-core = "0.1"
ratatui-textarea = { version = "0.9.1", default-features = false }
tui-logger = { version = "0.18.2", default-features = false, features = ["crossterm"] }
time = { version = "0.3", features = ["formatting", "local-offset", "macros"] }
url = "=2.4.1"
urlencoding = "=2.1.3"
libc = "0.2"
unicode-width = "0.1"
