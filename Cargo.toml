[package]
name = "mit"
version = "1.0.0"
edition = "2021"

[dependencies]
anyhow = "1.0"
base64 = "0.22"
clap = { version = "4.5", features = ["derive"] }
indexmap = "=2.11.4"
aes = "0.8"
cbc = "0.1"
rsa = "0.9"
rand = "0.8"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "gzip", "deflate", "rustls-tls", "cookies"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha1 = "0.10"
sha2 = "0.10"
md5 = "0.7"
crossterm = "0.28"
ratatui = "0.28"
ratatui-core = "0.1"
ratatui-textarea = "0.9.1"
url = "=2.4.1"
urlencoding = "=2.1.3"
libc = "0.2"
unicode-width = "0.1"
